<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="text" x1="0" y1="20" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9c8ff"/>
    </linearGradient>
    <linearGradient id="line" x1="6" y1="0" x2="58" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a1cff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#c04dff"/>
      <stop offset="1" stop-color="#7a1cff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#a24dff" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- dark background tile -->
  <rect width="64" height="64" rx="14" fill="#0c0618"/>

  <!-- neon lines above and below the letters -->
  <g filter="url(#glow)" stroke="url(#line)" stroke-width="2.2" stroke-linecap="round">
    <path d="M8 13h48"/>
    <path d="M8 51h48"/>
  </g>

  <!-- BWS letters -->
  <g filter="url(#textglow)" stroke="url(#text)" stroke-width="4.4" stroke-linejoin="round" stroke-linecap="square">
    <!-- B -->
    <path d="M8 22.5h7a4.25 4.25 0 0 1 0 8.5H8m0 0h7.5a4.75 4.75 0 0 1 0 9.5H8V22.5z"/>
    <!-- W -->
    <path d="M24.5 22.5l3.2 18 4.3-12 4.3 12 3.2-18" stroke-linecap="butt"/>
    <!-- S -->
    <path d="M55.5 22.5H49a3 3 0 0 0-3 3V28a3 3 0 0 0 3 3h3.5a3 3 0 0 1 3 3v3.5a3 3 0 0 1-3 3H46"/>
  </g>
</svg>
